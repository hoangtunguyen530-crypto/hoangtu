<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trái Tim Tình Yêu Vĩnh Cửu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0d0d11;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            init();
        });

        const customText = "iuu bà chã húi nhìuu";
        
        function heartEquation(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        class HeartParticle {
            constructor() {
                this.reset();
            }

            reset() {
                let t = Math.PI * 2 * Math.random();
                let pos = heartEquation(t);
                
                let scale = 12 + Math.random() * 4; 
                let factor = Math.sqrt(Math.random()); 

                this.x = width / 2 + pos.x * scale * factor;
                this.y = height / 2 - 80 + pos.y * scale * factor;
                
                this.baseX = this.x;
                this.baseY = this.y;

                this.size = Math.random() * 2 + 0.5;
                this.color = 'hsl(' + (Math.random() * 20 + 330) + ', 100%, ' + (Math.random() * 40 + 60) + '%)';
                this.alpha = Math.random() * 0.8 + 0.2;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (Math.hypot(this.x - this.baseX, this.y - this.baseY) > 15) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff2a8d';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FallingHeart {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 5 + 3;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.alpha = Math.random() * 0.6 + 0.4;
                this.color = 'hsl(' + (Math.random() * 20 + 335) + ', 100%, ' + (Math.random() * 25 + 70) + '%)';
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y > height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 6;
                ctx.shadowColor = '#ffb6c1';
                
                let x = this.x;
                let y = this.y;
                let s = this.size;
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x - s / 2, y - s / 2, x - s, y + s / 3, x, y + s);
                ctx.bezierCurveTo(x + s, y + s / 3, x + s / 2, y - s / 2, x, y);
                ctx.fill();
                
                ctx.restore();
            }
        }

        let heartParticles = [];
        let fallingHearts = [];

        function init() {
            heartParticles = [];
            fallingHearts = [];

            for (let i = 0; i < 3500; i++) {
                heartParticles.push(new HeartParticle());
            }

            for (let i = 0; i < 80; i++) {
                fallingHearts.push(new FallingHeart());
            }
        }

        function drawBottomText() {
            ctx.save();
            ctx.font = 'bold 26px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ff69b4';
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff1493';
            
            let textY = height / 2 + 180;
            ctx.fillText(customText, width / 2, textY);
            ctx.restore();
        }

        function animate() {
            ctx.fillStyle = 'rgba(13, 13, 17, 0.2)';
            ctx.fillRect(0, 0, width, height);

            fallingHearts.forEach(h => {
                h.update();
                h.draw();
            });

            heartParticles.forEach(p => {
                p.update();
                p.draw();
            });

            drawBottomText();

            requestAnimationFrame(animate);
        }

        init();
        animate();
    </script>
</body>
</html>
