<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo QR Tình Yêu</title>
    <!-- Thư viện tạo mã QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 {
            color: #ff4b6e;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #ff4b6e;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }
        #qrcode img {
            border-radius: 10px;
            padding: 10px;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Tạo Mã QR Cho Người Yêu ❤️</h2>
        <p>Nhập bất kỳ đường link hoặc lời nhắn nào vào đây:</p>
        
        <!-- Ô nhập nội dung -->
        <input type="text" id="textInput" placeholder="Dán link hoặc gõ lời nhắn..." oninput="generateQR()">

        <!-- Khu vực hiện mã QR -->
        <div id="qrcode"></div>
    </div>

    <script>
        // Khởi tạo mã QR mặc định ban đầu
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "https://hoangtunguyen530-crypto.github.io/hoangtu/",
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Hàm tự động cập nhật mã QR khi gõ phím
        function generateQR() {
            var inputVal = document.getElementById("textInput").value;
            qrcode.clear();
            if(inputVal.trim() !== "") {
                qrcode.makeCode(inputVal);
            } else {
                qrcode.makeCode("https://hoangtunguyen530-crypto.github.io/hoangtu/");
            }
        }
    </script>

</body>
</html>
