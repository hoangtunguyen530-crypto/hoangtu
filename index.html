<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo QR Tình Yêu</title>
    <!-- Nhúng thư viện tạo mã QR từ cdnjs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            text-align: center;
            padding: 50px;
        }
        h2 {
            color: #d11a2a;
        }
        input {
            width: 80%;
            max-width: 400px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #ff4d4d;
            border-radius: 8px;
            outline: none;
            margin-bottom: 20px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>Tạo Mã QR Cho Người Yêu Quét ❤️</h2>
    <p>Nhập link hoặc thông điệp bất kỳ vào ô dưới đây:</p>
    
    <!-- Ô nhập nội dung để tạo QR -->
    <input type="text" id="textInput" placeholder="Nhập link hoặc lời nhắn..." oninput="generateQR()">

    <!-- Nơi hiển thị mã QR -->
    <div id="qrcode"></div>

    <script>
        // Khởi tạo mã QR ban đầu
        var qrcode = new QRCode(document.getElementById("qrcode"), {
            text: "https://hoangtunguyen530-crypto.github.io/hoangtu/",
            width: 200,
            height: 200,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Hàm tự động cập nhật mã QR khi người dùng gõ chữ
        function generateQR() {
            var inputVal = document.getElementById("textInput").value;
            qrcode.clear();
            if(inputVal.trim() !== "") {
                qrcode.makeCode(inputVal);
            } else {
                qrcode.makeCode("https://hoangtunguyen530-crypto.github.io/hoangtu/");
            }
        }
    </script>

</body>
</html>
